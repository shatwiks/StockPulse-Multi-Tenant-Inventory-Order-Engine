name: StockPulse CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Typecheck, Concurrency Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockpulse_inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockpulse_inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/stockpulse_inventory?schema=public&connection_limit=10&pool_timeout=20"
      JWT_SECRET: "ci-test-jwt-secret-stockpulse-token-never-use-in-production"
      PORT: 3001
      CLIENT_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --prefix server

      - name: Run Strict TypeScript Verification (Server)
        run: npx tsc --noEmit --project server/tsconfig.json

      - name: Run Strict TypeScript Verification (Frontend)
        run: npx tsc --noEmit --project frontend/tsconfig.json

      - name: Run WCAG 2.1 AA Accessibility Verification
        run: npm run test:a11y

      - name: Deploy PostgreSQL Migrations
        run: npm run db:migrate --prefix server

      - name: Seed Multi-Tenant Organizations & Inventory
        run: npm run db:seed --prefix server

      - name: Verify Relational Check Constraints
        run: npm run test:constraints --prefix server

      - name: Run Phase 2 Security, RBAC & Concurrency Stress Test Suite
        run: npm run test:phase2 --prefix server

      - name: Run Phase 3 Frontend API & POS Integration Test Suite
        run: npm run test:phase3 --prefix server

      - name: Build Production Artifacts (Server & Frontend)
        run: npm run build
