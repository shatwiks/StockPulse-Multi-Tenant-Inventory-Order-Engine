name: StockPulse CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Typecheck, Concurrency Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockpulse_inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockpulse_inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/stockpulse_inventory?schema=public&connection_limit=10&pool_timeout=20"
      JWT_SECRET: "ci-test-jwt-secret-stockpulse-token-never-use-in-production"
      PORT: 3001
      CLIENT_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          echo "Installing root and workspace dependencies..."
          npm install --include-workspace-root
          npm install --prefix server
          npm install --prefix frontend

      - name: Wait for PostgreSQL Readiness
        run: |
          echo "Waiting for PostgreSQL service container to accept connections..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d stockpulse_inventory; then
              echo "PostgreSQL is ready and accepting queries!"
              exit 0
            fi
            echo "PostgreSQL is warming up ($i/30)... sleeping 2s"
            sleep 2
          done
          echo "Error: Timed out waiting for PostgreSQL container."
          exit 1

      - name: Generate Prisma Client (Linux Runner Environment)
        working-directory: server
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Strict TypeScript Verification (Server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Run Strict TypeScript Verification (Frontend)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run WCAG 2.1 AA Accessibility Verification
        working-directory: frontend
        run: npx tsx scripts/verify-a11y.ts

      - name: Deploy PostgreSQL Migrations
        working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Seed Multi-Tenant Organizations & Inventory
        working-directory: server
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Verify Relational Check Constraints
        working-directory: server
        run: npx tsx scripts/verify-constraints.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Run Phase 2 Security, RBAC & Concurrency Stress Test Suite
        working-directory: server
        run: npx tsx scripts/verify-phase2.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          NODE_ENV: test
          PORT: 3001

      - name: Run Phase 3 Frontend API & POS Integration Test Suite
        working-directory: server
        run: npx tsx scripts/verify-phase3.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          NODE_ENV: test
          PORT: 3001

      - name: Build Production Artifacts (Server)
        working-directory: server
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: production

      - name: Build Production Artifacts (Frontend)
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production
